<!DOCTYPE html>
<html>
<head>
    <title>JSON.stringify() Practice</title>
</head>

<body>

    <h1>JSON.stringify() Practice</h1>

    <label>Name:</label>
    <input type="text" id="name">
    <br><br>

    <label>Age:</label>
    <input type="number" id="age">
    <br><br>

    <label>City:</label>
    <input type="text" id="city">
    <br><br>

    <label>Subjects:</label>
    <input type="text" id="subjects" placeholder="JavaScript, Python, Java">
    <br><br>

    <label>Is Student:</label>
    <input type="checkbox" id="isStudent">
    <br><br>

    <button onclick="convertToJSON()">Convert to JSON</button>

    <h3>JSON Output:</h3>
    <pre id="output"></pre>

    <script>

        function convertToJSON() {

            // Take input from user
            const name = document.getElementById("name").value;
            const age = Number(document.getElementById("age").value);
            const city = document.getElementById("city").value;
            const isStudent = document.getElementById("isStudent").checked;

            const subjects = document
                .getElementById("subjects")
                .value
                .split(",");

            // Create JavaScript object
            const student = {
                name: name,
                age: age,
                city: city,
                isStudent: isStudent,

                // Array
                subjects: subjects,

                // Function
                greet: function () {
                    return "Hello";
                },

                // Undefined value
                address: undefined
            };

            try {

                // Convert JavaScript object into JSON
                const jsonData = JSON.stringify(student, null, 2);

                // Display JSON
                document.getElementById("output").textContent = jsonData;

                console.log("JSON Data:");
                console.log(jsonData);

            } catch (error) {

                document.getElementById("output").textContent =
                    "Error: " + error.message;

                console.log("Error:", error.message);
            }
        }

    </script>

</body>
</html>
